# Builds the game from source and publishes it to GitHub Pages on every push to main.
# One-time repo setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push supersedes a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The simulation snapshots in test/__snapshots__ are bit-exact game states recorded on Apple Silicon.
    # V8's Math.sin/cos/atan2 can differ in the last bit between ARM64 and x64, which a 40 s simulation
    # amplifies, so the tests run on the same platform and Node version the snapshots were recorded with.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      # typecheck + golden-master + playability + playthrough tests: a broken game is never published
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
